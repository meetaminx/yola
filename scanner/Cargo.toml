[package]
name = "yola-scanner"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Yola's Zcash viewing-key scanner: per-request address derivation and compact trial decryption (Sapling, Orchard, Ironwood) over the lightwalletd/Zaino gRPC API."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Official Zcash crates (librustzcash / orchard / sapling-crypto)
zcash_client_backend = { version = "0.25", default-features = false, features = ["orchard", "lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots"] }
zcash_keys = { version = "0.17", features = ["orchard", "sapling"] }
zcash_primitives = "0.31"
zcash_protocol = "0.11"
zcash_note_encryption = "0.5"
sapling-crypto = "0.9"
orchard = { version = "0.16", default-features = false, features = ["std"] }
zip32 = "0.3"

# Service plumbing
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
subtle = "2.5"

[dev-dependencies]
orchard = { version = "0.16", default-features = false, features = ["std", "test-dependencies"] }
rand = "0.10"
rand_core = "0.10"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 4
